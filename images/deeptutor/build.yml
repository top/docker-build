x-upstream: HKUDS/DeepTutor
x-ghcr-image: ghcr.io/hkuds/deeptutor

services:
  image:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/deeptutor:${VERSION:-check}
    build:
      context: ${UPSTREAM_CONTEXT:?Set absolute UPSTREAM_CONTEXT}
      dockerfile: Dockerfile
      target: production
      platforms:
        - linux/amd64
        - linux/arm64
