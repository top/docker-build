x-upstream: nano-muse/nanoMuse
x-ghcr-image: none

services:
  image:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/nanomuse-cloud:${VERSION:-check}
    build:
      context: ${UPSTREAM_CONTEXT:?Set absolute UPSTREAM_CONTEXT}/cloud
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
