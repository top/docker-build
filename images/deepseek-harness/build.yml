x-upstream: deepseek-ai/deepseek-harness

services:
  image:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/deepseek-harness:${VERSION:-check}
    build:
      context: ${UPSTREAM_CONTEXT:?Set absolute UPSTREAM_CONTEXT}
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
