x-upstream: vectorize-io/hindsight

services:
  image:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/hindsight:${VERSION:-check}
    build:
      context: ${UPSTREAM_CONTEXT:?Set absolute UPSTREAM_CONTEXT}
      dockerfile: docker/standalone/Dockerfile
      target: standalone
      platforms:
        - linux/amd64
        - linux/arm64