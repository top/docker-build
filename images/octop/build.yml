x-upstream: TencentCloud/Octop

services:
  image:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/octop:${VERSION:-check}
    build:
      context: ${UPSTREAM_CONTEXT:?Set absolute UPSTREAM_CONTEXT}
      dockerfile: deploy/docker/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64