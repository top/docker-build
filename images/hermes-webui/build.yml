x-upstream: nesquena/hermes-webui
x-ghcr-image: ghcr.io/nesquena/hermes-webui

services:
  image:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/hermes-webui:${VERSION:-check}
    build:
      context: ${UPSTREAM_CONTEXT:?Set absolute UPSTREAM_CONTEXT}
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
