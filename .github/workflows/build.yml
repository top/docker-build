name: Build & Sync Multi-Arch Images

on:
  schedule:
    # Hourly check: skips already-published versions in ~2s; syncs GHCR or builds on new release
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      project:
        description: "Project directory under images/ (or 'all')"
        required: true
        default: "all"
        type: string
      tag:
        description: "Upstream tag (empty = latest stable release)"
        required: false
        default: ""
        type: string
      sync_description:
        description: "Also sync docker.md description to Docker Hub"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "images/*/docker.md"

permissions:
  contents: read

jobs:
  build:
    name: Sync/Build Images
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: build-images-${{ inputs.project || 'all' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run 3-Tier Build & Sync
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ inputs.project || 'all' }}"
          TAG_ARG=""
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_ARG="--tag ${{ inputs.tag }}"
          fi
          python3 build.py "$TARGET" --yes $TAG_ARG

  discover-docs:
    name: Discover Changed Descriptions
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sync_description)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find added/modified docker.md files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PROJECT_INPUT: ${{ inputs.project }}
        run: |
          python3 -c '
          import glob, json, os, subprocess

          event = os.environ["EVENT_NAME"]
          projects = []

          if event == "workflow_dispatch":
              target = os.environ.get("PROJECT_INPUT", "all").strip()
              for p in sorted(glob.glob("images/*/docker.md")):
                  pid = os.path.basename(os.path.dirname(p))
                  if target == "all" or pid == target:
                      projects.append({"id": pid})
          else:
              before = os.environ.get("BEFORE_SHA", "")
              current = os.environ.get("CURRENT_SHA", "HEAD")
              if before and set(before) != {"0"}:
                  cmd = ["git", "diff", "--name-only", "--diff-filter=AM", before, current, "--", "images/*/docker.md"]
                  files = subprocess.check_output(cmd, text=True).splitlines()
              else:
                  files = sorted(glob.glob("images/*/docker.md"))

              for f in sorted(set(files)):
                  parts = f.split("/")
                  if len(parts) == 3 and parts[0] == "images" and parts[2] == "docker.md":
                      projects.append({"id": parts[1]})

          matrix = json.dumps({"include": projects})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={matrix}\n")
          '

  description:
    name: Sync ${{ matrix.id }} Description
    needs: discover-docs
    if: needs.discover-docs.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-docs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.id }}
          readme-filepath: images/${{ matrix.id }}/docker.md
